<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>클라이언트 모듈 구조</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 기준: docs/DESIGN.md §6 계통도 규칙. 모듈 = 각진 사각형(먹 1.5px), 예정 = 강철 점선, import = 먹 가는 선 */
  .mod { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  .mod-main { fill: var(--paper); stroke: var(--ink); stroke-width: 3; }
  .mod-side { fill: var(--paper); stroke: var(--steel); stroke-width: 1.5; }
  .mod-plan { fill: var(--paper); stroke: var(--steel); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .file { font-family: var(--mono); font-size: 17px; font-weight: 600; }
  .file-main { font-family: var(--mono); font-size: 22px; font-weight: 600; }
  .d { font-size: 15px; }
  .no { font-size: 15px; fill: var(--steel); }
  .wire { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .grid { stroke: var(--rule); stroke-width: 1; }
</style>
</head>
<body>
<div id="diagram">
<svg width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="var(--ink)"/></marker>
  </defs>

  <text x="60" y="66" class="t-title">클라이언트 모듈 구조</text>
  <text x="60" y="100" class="t-sub">빌드 없는 Vanilla JS(ES Modules). 현장 화면과 전문가 화면이 같은 모듈을 쓴다.</text>

  <!-- 페이지 -->
  <rect x="60" y="170" width="260" height="78" rx="2" class="mod-side"/>
  <text x="80" y="200" class="file">index.html</text>
  <text x="80" y="228" class="d">Room 생성, 폰용 링크와 QR</text>

  <rect x="60" y="262" width="260" height="78" rx="2" class="mod-side"/>
  <text x="80" y="292" class="file">check.html</text>
  <text x="80" y="320" class="d">HTTPS와 카메라 권한 점검</text>
  <text x="60" y="368" class="t-s">독립 페이지</text>

  <rect x="60" y="416" width="260" height="78" rx="2" class="mod"/>
  <text x="80" y="446" class="file">field.html</text>
  <text x="80" y="474" class="d">현장 작업자 화면</text>

  <rect x="60" y="508" width="260" height="78" rx="2" class="mod"/>
  <text x="80" y="538" class="file">expert.html</text>
  <text x="80" y="566" class="d">원격 전문가 화면</text>

  <!-- 페이지 → app.js -->
  <path d="M320 455 H418" class="wire" marker-end="url(#arr)"/>
  <path d="M320 547 H418" class="wire" marker-end="url(#arr)"/>

  <!-- app.js: 위치와 선 굵기로 중심을 표시 -->
  <rect x="420" y="410" width="280" height="170" rx="2" class="mod-main"/>
  <text x="444" y="452" class="file-main">app.js</text>
  <text x="444" y="486" class="t-code">startApp({ role })</text>
  <text x="444" y="520" class="d">입장, Offer/Answer 교환,</text>
  <text x="444" y="544" class="d">퇴장을 차례로 진행</text>

  <!-- app.js → 구현 모듈 (분기 버스) -->
  <path d="M700 495 H760" class="wire"/>
  <path d="M760 218 V536" class="wire"/>
  <circle cx="760" cy="495" r="3.5" fill="var(--ink)"/>
  <path d="M760 218 H818" class="wire" marker-end="url(#arr)"/>
  <path d="M760 375 H818" class="wire" marker-end="url(#arr)"/>
  <path d="M760 536 H818" class="wire" marker-end="url(#arr)"/>

  <!-- 1주차 구현 -->
  <text x="820" y="150" class="t-s">1주차 구현, E2E 13/13 통과</text>

  <rect x="820" y="170" width="380" height="96" rx="2" class="mod"/>
  <text x="844" y="200" class="file">signaling.js</text>
  <text x="844" y="228" class="d">WebSocket 클라이언트</text>
  <text x="844" y="250" class="d">서버 메시지를 type별 이벤트로 나눔</text>

  <rect x="820" y="290" width="380" height="170" rx="2" class="mod"/>
  <text x="844" y="320" class="file">peer.js</text>
  <text x="926" y="320" class="t-code" style="fill:var(--steel)">PeerSession</text>
  <text x="844" y="348" class="d">RTCPeerConnection, Offer/Answer</text>
  <text x="844" y="370" class="d">Trickle ICE, 원격 Candidate 대기열</text>
  <text x="844" y="392" class="d">DataChannel control(id 0), pointer(id 1)</text>
  <text x="844" y="414" class="d">측정 시점 t0~t7, 선택 경로 조회</text>
  <text x="844" y="436" class="d">negotiated:true로 glare 없이 양쪽 같은 코드</text>

  <!-- peer.js → signaling.js (send 호출) -->
  <path d="M1150 290 V268" class="wire" marker-end="url(#arr)"/>
  <text x="1160" y="284" class="t-code" style="font-size:13px;fill:var(--steel)">send()</text>

  <rect x="820" y="488" width="380" height="96" rx="2" class="mod"/>
  <text x="844" y="518" class="file">ui.js</text>
  <text x="844" y="546" class="d">상태, 연결 정보, 상태 변화, 연결 후보</text>
  <text x="844" y="568" class="d">연결 기록, 기록 저장(JSON)</text>

  <!-- 2주차 추가 예정 -->
  <text x="1260" y="150" class="t-s">2주차 추가 예정</text>

  <rect x="1260" y="170" width="280" height="78" rx="2" class="mod-plan"/>
  <text x="1280" y="200" class="file">media.js</text>
  <text x="1520" y="200" text-anchor="end" class="no">#15</text>
  <text x="1280" y="228" class="d" style="fill:var(--steel)">getUserMedia, 화질</text>

  <rect x="1260" y="262" width="280" height="78" rx="2" class="mod-plan"/>
  <text x="1280" y="292" class="file">datachannel.js</text>
  <text x="1520" y="292" text-anchor="end" class="no">#16 #17</text>
  <text x="1280" y="320" class="d" style="fill:var(--steel)">메시지, ack, 포인터</text>

  <rect x="1260" y="354" width="280" height="78" rx="2" class="mod-plan"/>
  <text x="1280" y="384" class="file">stats.js</text>
  <text x="1520" y="384" text-anchor="end" class="no">#18</text>
  <text x="1280" y="412" class="d" style="fill:var(--steel)">getStats 1초 간격, CSV</text>

  <rect x="1260" y="446" width="280" height="78" rx="2" class="mod-plan"/>
  <text x="1280" y="476" class="file">tools/g2g-latency</text>
  <text x="1520" y="476" text-anchor="end" class="no">#19</text>
  <text x="1280" y="504" class="d" style="fill:var(--steel)">QR 타임스탬프로 지연 측정</text>

  <!-- 브라우저 내장 API: 표 한 줄 -->
  <line x1="60" x2="1540" y1="640" y2="640" stroke="var(--ink)" stroke-width="1.5"/>
  <line x1="60" x2="1540" y1="748" y2="748" class="grid"/>
  <g class="grid">
    <line x1="400" x2="400" y1="640" y2="748"/>
    <line x1="628" x2="628" y1="640" y2="748"/>
    <line x1="856" x2="856" y1="640" y2="748"/>
    <line x1="1084" x2="1084" y1="640" y2="748"/>
    <line x1="1312" x2="1312" y1="640" y2="748"/>
  </g>
  <text x="60" y="678" class="t-b" style="font-weight:600">브라우저 내장 API</text>
  <text x="60" y="704" class="t-s">설치 없이 사용</text>

  <text x="420" y="678" class="t-code" style="font-size:17px">WebSocket</text>
  <text x="420" y="704" class="t-s">signaling.js</text>
  <text x="420" y="726" class="t-s">서버 /ws에 연결</text>

  <text x="648" y="678" class="t-code" style="font-size:17px">RTCPeerConnection</text>
  <text x="648" y="704" class="t-s">peer.js</text>

  <text x="876" y="678" class="t-code" style="font-size:17px">RTCDataChannel</text>
  <text x="876" y="704" class="t-s">peer.js</text>

  <text x="1104" y="678" class="t-code" style="font-size:17px">getStats</text>
  <text x="1104" y="704" class="t-s">peer.js, stats.js(예정)</text>

  <text x="1332" y="678" class="t-code" style="font-size:17px;fill:var(--steel)">getUserMedia</text>
  <text x="1332" y="704" class="t-s">media.js(예정)</text>

  <!-- 범례 -->
  <g transform="translate(60,810)">
    <rect x="0" y="-13" width="36" height="22" rx="2" class="mod"/>
    <text x="48" y="4" class="t-s" style="fill:var(--ink)">구현된 모듈</text>
    <rect x="190" y="-13" width="36" height="22" rx="2" class="mod-plan"/>
    <text x="238" y="4" class="t-s" style="fill:var(--ink)">추가 예정 모듈과 이슈 번호</text>
    <path d="M490 -2 H536" class="wire" marker-end="url(#arr)"/>
    <text x="548" y="4" class="t-s" style="fill:var(--ink)">import 또는 호출 (화살표 쪽 모듈을 쓴다)</text>
  </g>
</svg>
</div>
</body>
</html>
