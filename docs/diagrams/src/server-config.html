<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>서버 구성도</title>
<link rel="stylesheet" href="base.css">
<style>
  .t-r { font-size: 16px; fill: #212529; }
  .t-lbl { font-size: 18px; font-weight: 700; fill: #212529; }
  .t-pill { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; font-weight: 700; fill: #fff; }
</style>
</head>
<body>
<div id="diagram">
<svg width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="a-http" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#495057"/></marker>
    <marker id="a-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7048e8"/></marker>
    <marker id="a-stun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#868e96"/></marker>
    <marker id="a-media" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ca678"/></marker>
    <marker id="a-turn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59f00"/></marker>
  </defs>

  <!-- 제목 -->
  <text x="60" y="66" class="t-title">서버 구성도 — 개발자 PC 1대로 운영하는 PoC 서버</text>
  <text x="60" y="100" class="t-sub">Node.js 프로세스 하나가 페이지·API·시그널링을 맡고, 접속은 같은 LAN(A) 또는 ngrok 터널(B)로 연다</text>

  <!-- ================= 개발자 PC ================= -->
  <rect x="50" y="130" width="700" height="680" rx="28" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/>
  <use href="#i-laptop" x="70" y="140" width="44" height="44" color="#495057"/>
  <text x="124" y="172" class="t-h">개발자 PC</text>
  <text x="246" y="172" class="t-s">MacBook Air · macOS</text>
  <text x="728" y="172" text-anchor="end" class="t-s">LAN IP 192.168.0.111</text>

  <!-- Node.js 프로세스 -->
  <rect x="72" y="190" width="656" height="450" rx="18" fill="#f3f0ff" stroke="#b197fc" stroke-width="2"/>
  <use href="#i-server" x="88" y="202" width="44" height="44" color="#7048e8"/>
  <text x="146" y="230" class="t-h" style="fill:#5f3dc4">Node.js 프로세스</text>
  <rect x="566" y="208" width="146" height="32" rx="16" fill="#7048e8"/>
  <text x="639" y="229" text-anchor="middle" class="t-pill">0.0.0.0:3000</text>
  <text x="146" y="258"><tspan class="t-mono">server/src/index.js</tspan><tspan class="t-s" dx="10">· npm start 로 실행</tspan></text>
  <text x="146" y="280" class="t-s">HTTP 기본 · server/certs/cert.pem·key.pem 이 있으면 HTTPS 자동</text>

  <!-- ① 정적 파일 서빙 -->
  <rect x="88" y="294" width="624" height="130" rx="14" fill="#fff" stroke="#d0bfff"/>
  <use href="#i-folder" x="102" y="306" width="30" height="30" color="#7048e8"/>
  <text x="140" y="328" class="t-lbl">정적 파일 서빙</text>
  <line x1="272" y1="306" x2="272" y2="412" stroke="#e5dbff"/>
  <text x="288" y="320"><tspan class="t-mono" style="font-weight:700">/</tspan><tspan class="t-r" dx="8">→</tspan><tspan class="t-mono" dx="8" style="font-weight:700">client/</tspan></text>
  <text x="304" y="344"><tspan class="t-mono">index.html</tspan><tspan class="t-r" dx="10">시작화면 · Room 생성 · QR</tspan></text>
  <text x="304" y="366"><tspan class="t-mono">field.html</tspan><tspan class="t-r" dx="10">현장 ·</tspan><tspan class="t-mono" dx="8">expert.html</tspan><tspan class="t-r" dx="10">전문가</tspan></text>
  <text x="304" y="388"><tspan class="t-mono">check.html</tspan><tspan class="t-r" dx="10">환경점검 ·</tspan><tspan class="t-mono" dx="8">js/ · css/</tspan></text>
  <text x="288" y="412"><tspan class="t-mono" style="font-weight:700">/tools/</tspan><tspan class="t-r" dx="8">→</tspan><tspan class="t-mono" dx="8" style="font-weight:700">tools/</tspan><tspan class="t-s" dx="12">G2G 측정 도구 (예정)</tspan></text>

  <!-- ② HTTP API -->
  <rect x="88" y="434" width="624" height="62" rx="14" fill="#fff" stroke="#d0bfff"/>
  <use href="#i-code" x="102" y="450" width="30" height="30" color="#7048e8"/>
  <text x="140" y="471" class="t-lbl">HTTP API</text>
  <line x1="272" y1="444" x2="272" y2="486" stroke="#e5dbff"/>
  <text x="288" y="459"><tspan class="t-mono" style="font-weight:700">/healthz</tspan><tspan class="t-r" dx="12">상태 확인</tspan></text>
  <text x="288" y="483"><tspan class="t-mono" style="font-weight:700">/api/info</tspan><tspan class="t-r" dx="12">LAN IP 목록 → 폰용 링크·QR 생성</tspan></text>

  <!-- ③ WebSocket 시그널링 -->
  <rect x="88" y="506" width="624" height="120" rx="14" fill="#fff" stroke="#d0bfff"/>
  <use href="#i-swap" x="102" y="518" width="30" height="30" color="#7048e8"/>
  <text x="140" y="540" class="t-lbl">WebSocket</text>
  <text x="140" y="564" class="t-mono" style="font-weight:700">/ws</text>
  <text x="140" y="590" class="t-s">signaling.js</text>
  <line x1="272" y1="516" x2="272" y2="616" stroke="#e5dbff"/>
  <text x="288" y="532" class="t-r">Room Map: room → 최대 2명 (역할 field / expert)</text>
  <text x="288" y="556" class="t-r">offer · answer · ice 중계 (내용은 해석하지 않음)</text>
  <text x="288" y="580" class="t-r">peer-joined / peer-left 알림 · 오류 코드 (ROOM_FULL 등)</text>
  <text x="288" y="604" class="t-r">30초 ping/pong · 메시지 64KB 제한</text>

  <!-- 개발 도구 -->
  <rect x="72" y="680" width="380" height="114" rx="16" fill="#fff" stroke="#ced4da"/>
  <use href="#i-terminal" x="88" y="690" width="28" height="28" color="#495057"/>
  <text x="124" y="711" class="t-lbl">개발 도구</text>
  <text x="92" y="738" class="t-mono" style="font-weight:700">npm test</text>
  <text x="250" y="738" class="t-s">서버 단위 테스트 5개</text>
  <text x="92" y="760" class="t-mono" style="font-weight:700">npm run e2e</text>
  <text x="250" y="760" class="t-s">Chrome 자동 연결 시험</text>
  <text x="92" y="782" class="t-mono" style="font-weight:700">npm run diagrams</text>
  <text x="250" y="782" class="t-s">다이어그램 PNG 생성</text>

  <!-- ngrok agent -->
  <rect x="470" y="680" width="258" height="114" rx="16" fill="#fff" stroke="#b197fc" stroke-width="2"/>
  <use href="#i-tunnel" x="486" y="692" width="34" height="34" color="#7048e8"/>
  <text x="530" y="716" class="t-lbl">ngrok agent</text>
  <text x="488" y="752" class="t-mono" style="font-weight:700">npm run tunnel</text>
  <text x="488" y="776" class="t-mono" style="fill:#6c757d">= ngrok http 3000</text>

  <!-- ngrok agent → localhost:3000 -->
  <line x1="590" y1="678" x2="590" y2="644" stroke="#495057" stroke-width="2.5" marker-end="url(#a-http)"/>
  <line x1="602" y1="678" x2="602" y2="644" stroke="#7048e8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a-signal)"/>
  <text x="616" y="666" class="t-s">localhost:3000</text>

  <!-- ================= (A) 같은 LAN ================= -->
  <rect x="810" y="150" width="300" height="206" rx="20" fill="#fff" stroke="#ced4da" stroke-width="2"/>
  <circle cx="858" cy="196" r="28" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <use href="#i-router" x="838" y="176" width="40" height="40" color="#495057"/>
  <text x="900" y="192" class="t-h" style="font-size:22px">(A) 같은 LAN</text>
  <text x="900" y="216" class="t-s">같은 Wi-Fi 공유기에 접속</text>
  <rect x="826" y="248" width="268" height="32" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="960" y="269" text-anchor="middle" class="t-mono" style="font-weight:700">http://192.168.0.111:3000</text>
  <circle cx="834" cy="304" r="5" fill="#e03131"/>
  <text x="848" y="310" class="t-r">HTTP라서 폰 카메라 불가</text>
  <circle cx="834" cy="332" r="5" fill="#2f9e44"/>
  <text x="848" y="338" class="t-r">P2P 연결 시험은 가능</text>

  <!-- ================= (B) 외부 / 다른 네트워크 ================= -->
  <rect x="810" y="408" width="300" height="262" rx="20" fill="#fff" stroke="#ced4da" stroke-width="2"/>
  <circle cx="858" cy="454" r="28" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <use href="#i-globe" x="838" y="434" width="40" height="40" color="#495057"/>
  <text x="900" y="450" class="t-h" style="font-size:22px">(B) 외부 접속</text>
  <text x="900" y="474" class="t-s">다른 네트워크 · LTE / 5G</text>
  <text x="826" y="516" class="t-lbl">ngrok cloud edge</text>
  <text x="988" y="516" class="t-s">HTTPS · WSS</text>
  <rect x="826" y="530" width="268" height="32" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="960" y="551" text-anchor="middle" class="t-mono" style="font-weight:700">https://xxxx.ngrok-free.app</text>
  <circle cx="834" cy="590" r="5" fill="#2f9e44"/>
  <text x="848" y="596" class="t-r">HTTPS라서 카메라 가능</text>
  <circle cx="834" cy="618" r="5" fill="#2f9e44"/>
  <text x="848" y="624" class="t-r">다른 네트워크 연결 시험 (#37)</text>
  <text x="826" y="652" class="t-s">agent ⇄ edge 터널로 3000번 포트 공개</text>

  <!-- ================= 클라이언트 ================= -->
  <rect x="1160" y="130" width="390" height="412" rx="24" fill="#fff" stroke="#ced4da" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1180" y="160" class="t-lbl">클라이언트 브라우저</text>
  <text x="1530" y="160" text-anchor="end" class="t-s">설치 없음</text>

  <!-- 현장 -->
  <rect x="1180" y="176" width="350" height="140" rx="18" fill="#fff4e6" stroke="#ffc078" stroke-width="2"/>
  <use href="#i-phone" x="1188" y="196" width="80" height="80" color="#e8590c"/>
  <text x="1278" y="212" class="t-h" style="fill:#d9480f">현장 작업자</text>
  <text x="1278" y="240" class="t-b">Smartphone 브라우저</text>
  <text x="1278" y="266" class="t-mono">field.html</text>
  <text x="1278" y="296" class="t-s">(A) 같은 Wi-Fi · (B) LTE/5G</text>

  <!-- P2P -->
  <line x1="1228" y1="322" x2="1228" y2="386" stroke="#0ca678" stroke-width="6" marker-end="url(#a-media)" marker-start="url(#a-media)"/>
  <text x="1252" y="350" style="fill:#0b7a5a;font-size:17px;font-weight:800">P2P 직접: 영상·음성·데이터</text>
  <text x="1252" y="372" class="t-s">서버를 거치지 않음</text>

  <!-- 전문가 -->
  <rect x="1180" y="392" width="350" height="136" rx="18" fill="#e7f5ff" stroke="#a5d8ff" stroke-width="2"/>
  <use href="#i-laptop" x="1188" y="414" width="80" height="80" color="#1c7ed6"/>
  <text x="1278" y="428" class="t-h" style="fill:#1971c2">원격 전문가</text>
  <text x="1278" y="456" class="t-b">PC 브라우저</text>
  <text x="1278" y="482" class="t-mono">expert.html</text>
  <text x="1278" y="510" class="t-s">(A) 같은 LAN · (B) 외부 망</text>

  <!-- ================= 브라우저가 쓰는 외부 서비스 ================= -->
  <text x="1355" y="574" text-anchor="middle" class="t-s">브라우저가 직접 사용 · 서버는 관여 안 함</text>
  <path d="M1182 544 L1182 594" stroke="#868e96" stroke-width="2.5" stroke-dasharray="3 6" fill="none" marker-end="url(#a-stun)"/>
  <path d="M1528 544 L1528 594" stroke="#f59f00" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#a-turn)"/>

  <rect x="1160" y="598" width="188" height="100" rx="16" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <use href="#i-target" x="1172" y="608" width="34" height="34" color="#495057"/>
  <text x="1214" y="632" class="t-lbl" style="font-size:17px">Google STUN</text>
  <text x="1176" y="664" class="t-mono">stun.l.google.com</text>
  <text x="1176" y="686" class="t-s">:19302 · UDP</text>

  <rect x="1362" y="598" width="188" height="100" rx="16" fill="#fff9db" stroke="#f59f00" stroke-width="2" stroke-dasharray="8 6"/>
  <use href="#i-relay" x="1374" y="608" width="34" height="34" color="#e67700"/>
  <text x="1416" y="632" class="t-lbl" style="font-size:17px;fill:#e67700">TURN 호스팅</text>
  <text x="1376" y="664" class="t-s">선택 · #38</text>
  <text x="1376" y="686" class="t-s">P2P 실패 시 중계</text>

  <!-- ================= 연결선: HTTP(S) + WebSocket ================= -->
  <!-- 서버 → (A) → 클라이언트 -->
  <line x1="712" y1="218" x2="810" y2="218" stroke="#495057" stroke-width="2.5"/>
  <line x1="712" y1="230" x2="810" y2="230" stroke="#7048e8" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="1110" y1="218" x2="1158" y2="218" stroke="#495057" stroke-width="2.5" marker-end="url(#a-http)"/>
  <line x1="1110" y1="230" x2="1158" y2="230" stroke="#7048e8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a-signal)"/>
  <!-- ngrok agent → (B) → 클라이언트 -->
  <path d="M728 726 C 774 726, 764 586, 810 586" fill="none" stroke="#495057" stroke-width="2.5"/>
  <path d="M728 738 C 786 738, 776 598, 810 598" fill="none" stroke="#7048e8" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="1110" y1="464" x2="1158" y2="464" stroke="#495057" stroke-width="2.5" marker-end="url(#a-http)"/>
  <line x1="1110" y1="476" x2="1158" y2="476" stroke="#7048e8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a-signal)"/>

  <!-- ================= 핵심 메시지 ================= -->
  <rect x="810" y="722" width="740" height="88" rx="18" fill="#e6fcf5" stroke="#0ca678" stroke-width="2"/>
  <use href="#i-shield" x="830" y="742" width="48" height="48" color="#0ca678"/>
  <text x="896" y="758" style="font-size:21px;font-weight:800;fill:#087f5b">서버는 페이지와 연결 정보만 다룬다</text>
  <text x="896" y="790" class="t-b">영상·음성·데이터는 브라우저끼리 P2P로 직접 흐른다</text>

  <!-- 범례 -->
  <g transform="translate(60,852)">
    <line x1="0" y1="0" x2="46" y2="0" stroke="#495057" stroke-width="2.5"/>
    <text x="56" y="6" class="t-s" style="fill:#212529">HTTP(S) 페이지·API</text>
    <line x1="270" y1="0" x2="316" y2="0" stroke="#7048e8" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="326" y="6" class="t-s" style="fill:#212529">WebSocket 시그널링 (WS/WSS)</text>
    <line x1="600" y1="0" x2="646" y2="0" stroke="#868e96" stroke-width="2.5" stroke-dasharray="3 6"/>
    <text x="656" y="6" class="t-s" style="fill:#212529">STUN 질의 (UDP)</text>
    <line x1="850" y1="0" x2="896" y2="0" stroke="#0ca678" stroke-width="6"/>
    <text x="906" y="6" class="t-s" style="fill:#212529">P2P 미디어·데이터</text>
    <line x1="1110" y1="0" x2="1156" y2="0" stroke="#f59f00" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="1166" y="6" class="t-s" style="fill:#212529">TURN Relay (선택)</text>
  </g>
</svg>
</div>
<script src="icons.js"></script>
</body>
</html>
