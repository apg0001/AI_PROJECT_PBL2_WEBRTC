<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>서버 구성도</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 계통도 선 (DESIGN.md §6) */
  .ln-http { fill: none; stroke: var(--ink); stroke-width: 2; }
  .ln-sig  { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 10 6; }
  .ln-p2p  { fill: none; stroke: var(--ok); stroke-width: 8; }
  .ln-stun { fill: none; stroke: var(--steel); stroke-width: 2.5; stroke-dasharray: 0.1 7; stroke-linecap: round; }
  .ln-turn { fill: none; stroke: var(--caution); stroke-width: 3; stroke-dasharray: 18 8; }
  .zone    { fill: none; stroke: var(--rule); stroke-width: 1.5; }
  .row     { stroke: var(--rule); stroke-width: 1; }
  .equip   { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  .equip-opt { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .zone-name { font-size: 15px; font-weight: 600; fill: var(--steel); }
  .name { font-size: 17px; font-weight: 600; }
  .cell { font-size: 15px; }
  .cell-b { font-size: 15px; font-weight: 600; }
  .lbl  { font-size: 15px; fill: var(--ink); }
  .no   { font-size: 15px; font-weight: 600; fill: var(--stop); }
  .yes  { font-size: 15px; font-weight: 600; fill: var(--ok); }
  .t-code.s { fill: var(--steel); }
</style>
</head>
<body>
<div id="diagram">
<svg width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--ink)"/></marker>
    <marker id="a-stun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--steel)"/></marker>
  </defs>

  <!-- 제목 -->
  <text x="60" y="66" class="t-title">PoC 서버 구성도</text>
  <text x="60" y="100" class="t-sub">개발자 PC의 Node.js 프로세스 하나가 페이지와 연결 정보만 다루고, 접속은 같은 LAN(A) 또는 ngrok 터널(B)로 연다.</text>

  <!-- ================= 개발자 PC ================= -->
  <rect x="40" y="128" width="720" height="686" class="zone"/>
  <text x="60" y="156" class="zone-name">개발자 PC</text>
  <text x="144" y="156" class="t-s">MacBook Air, macOS, LAN IP <tspan class="t-code s">192.168.0.111</tspan></text>

  <!-- Node.js 프로세스 -->
  <rect x="60" y="172" width="680" height="498" rx="2" class="equip"/>
  <text x="84" y="202" class="name">Node.js 프로세스</text>
  <text x="232" y="202" class="t-code">0.0.0.0:3000</text>
  <text x="84" y="228" class="t-s"><tspan class="t-code s">npm start</tspan>로 실행, 진입점 <tspan class="t-code s">server/src/index.js</tspan></text>
  <text x="84" y="252" class="t-s">기본은 HTTP, <tspan class="t-code s">server/certs/</tspan>에 cert.pem과 key.pem이 있으면 HTTPS</text>

  <!-- 엔드포인트 표 -->
  <text x="84" y="288" class="t-xs">역할</text>
  <text x="214" y="288" class="t-xs">경로</text>
  <text x="380" y="288" class="t-xs">하는 일</text>
  <line x1="84" y1="298" x2="716" y2="298" class="row"/>

  <text x="84" y="322" class="cell-b">정적 파일</text>
  <text x="84" y="346" class="t-code s" style="font-size:14px">client/</text>
  <text x="214" y="322" class="t-code">/index.html</text><text x="380" y="322" class="cell">시작 화면, Room 생성, QR</text>
  <text x="214" y="346" class="t-code">/field.html</text><text x="380" y="346" class="cell">현장 화면</text>
  <text x="214" y="370" class="t-code">/expert.html</text><text x="380" y="370" class="cell">전문가 화면</text>
  <text x="214" y="394" class="t-code">/check.html</text><text x="380" y="394" class="cell">환경 점검</text>
  <text x="214" y="418" class="t-code">/js/ /css/</text><text x="380" y="418" class="cell">화면 스크립트와 스타일</text>
  <text x="214" y="442" class="t-code">/tools/</text><text x="380" y="442" class="cell"><tspan class="t-code s">tools/</tspan> 폴더, G2G 측정 도구 (예정)</text>
  <line x1="84" y1="456" x2="716" y2="456" class="row"/>

  <text x="84" y="480" class="cell-b">HTTP API</text>
  <text x="214" y="480" class="t-code">/healthz</text><text x="380" y="480" class="cell">상태 확인</text>
  <text x="214" y="504" class="t-code">/api/info</text><text x="380" y="504" class="cell">LAN IP 목록, 폰용 링크와 QR 생성에 사용</text>
  <line x1="84" y1="518" x2="716" y2="518" class="row"/>

  <text x="84" y="542" class="cell-b">WebSocket</text>
  <text x="84" y="566" class="cell-b">시그널링</text>
  <text x="84" y="590" class="t-code s" style="font-size:14px">signaling.js</text>
  <text x="214" y="542" class="t-code">/ws</text><text x="380" y="542" class="cell">Room마다 최대 2명, 역할은 field 또는 expert</text>
  <text x="380" y="566" class="cell">offer, answer, ice를 해석 없이 상대에게 전달</text>
  <text x="380" y="590" class="cell">peer-joined, peer-left 알림</text>
  <text x="380" y="614" class="cell">오류 코드 (ROOM_FULL 등)</text>
  <text x="380" y="638" class="cell">30초 ping/pong, 메시지 64KB 제한</text>

  <!-- 개발 도구 (표) -->
  <text x="60" y="714" class="name">개발 도구</text>
  <line x1="60" y1="724" x2="440" y2="724" class="row"/>
  <text x="60" y="748" class="t-code">npm test</text><text x="236" y="748" class="cell">서버 단위 테스트 5개</text>
  <text x="60" y="772" class="t-code">npm run e2e</text><text x="236" y="772" class="cell">Chrome 자동 연결 시험</text>
  <text x="60" y="796" class="t-code">npm run diagrams</text><text x="236" y="796" class="cell">다이어그램 PNG 생성</text>

  <!-- ngrok agent -->
  <rect x="480" y="716" width="260" height="76" rx="2" class="equip"/>
  <text x="500" y="742" class="name">ngrok agent</text>
  <text x="500" y="766" class="t-code">npm run tunnel</text>
  <text x="500" y="786" class="t-code s" style="font-size:14px">ngrok http 3000</text>

  <!-- agent → localhost:3000 -->
  <line x1="590" y1="716" x2="590" y2="670" class="ln-http"/>
  <line x1="606" y1="716" x2="606" y2="670" class="ln-sig"/>
  <text x="620" y="700" class="t-code s" style="font-size:14px">localhost:3000</text>

  <!-- ================= (A) 같은 LAN ================= -->
  <line x1="740" y1="216" x2="1232" y2="216" class="ln-http"/>
  <line x1="740" y1="230" x2="1232" y2="230" class="ln-sig"/>

  <text x="800" y="200" class="name">(A) 같은 LAN</text>
  <text x="920" y="200" class="t-s">같은 Wi-Fi 공유기에 접속</text>
  <text x="800" y="262" class="t-code">http://192.168.0.111:3000</text>
  <line x1="800" y1="278" x2="1120" y2="278" class="row"/>
  <text x="800" y="300" class="cell">폰 카메라</text><text x="980" y="300" class="no">불가</text><text x="1018" y="300" class="t-s">HTTP라서</text>
  <line x1="800" y1="312" x2="1120" y2="312" class="row"/>
  <text x="800" y="334" class="cell">P2P 연결 시험</text><text x="980" y="334" class="yes">가능</text>
  <line x1="800" y1="346" x2="1120" y2="346" class="row"/>

  <!-- ================= (B) 외부 접속 ================= -->
  <path d="M740 744 H772 V448 H800" class="ln-http"/>
  <path d="M740 756 H786 V462 H800" class="ln-sig"/>
  <line x1="1100" y1="448" x2="1226" y2="448" class="ln-http"/>
  <line x1="1100" y1="462" x2="1226" y2="462" class="ln-sig"/>

  <text x="800" y="406" class="name">(B) 외부 접속</text>
  <text x="920" y="406" class="t-s">다른 네트워크, LTE, 5G</text>
  <rect x="800" y="422" width="300" height="70" rx="2" class="equip"/>
  <text x="820" y="448" class="name">ngrok cloud edge <tspan class="t-s" style="font-weight:400">HTTPS, WSS</tspan></text>
  <text x="820" y="476" class="t-code" style="font-size:14px">https://xxxx.ngrok-free.app</text>
  <line x1="800" y1="520" x2="1120" y2="520" class="row"/>
  <text x="800" y="542" class="cell">폰 카메라</text><text x="980" y="542" class="yes">가능</text><text x="1018" y="542" class="t-s">HTTPS라서</text>
  <line x1="800" y1="554" x2="1120" y2="554" class="row"/>
  <text x="800" y="576" class="cell">다른 네트워크 시험</text><text x="980" y="576" class="yes">가능</text><text x="1018" y="576" class="t-s">#37</text>
  <line x1="800" y1="588" x2="1120" y2="588" class="row"/>
  <text x="800" y="616" class="t-s">agent와 edge 사이 터널로 3000번 포트를 공개</text>

  <!-- ================= 클라이언트 브라우저 ================= -->
  <text x="1224" y="156" class="zone-name">클라이언트 브라우저, 설치 없음</text>

  <use href="#i-phone" x="1214" y="184" width="76" height="76" style="color:var(--ink)"/>
  <text x="1304" y="208" class="t-h">현장 작업자</text>
  <text x="1304" y="232" class="cell">스마트폰 브라우저, <tspan class="t-code">field.html</tspan></text>
  <text x="1304" y="254" class="t-s">(A) 같은 Wi-Fi, (B) LTE나 5G</text>

  <use href="#i-laptop" x="1212" y="416" width="80" height="80" style="color:var(--ink)"/>
  <text x="1304" y="440" class="t-h">원격 전문가</text>
  <text x="1304" y="464" class="cell">PC 브라우저, <tspan class="t-code">expert.html</tspan></text>
  <text x="1304" y="486" class="t-s">(A) 같은 LAN, (B) 외부 망</text>

  <!-- P2P -->
  <line x1="1252" y1="258" x2="1252" y2="430" class="ln-p2p"/>
  <text x="1304" y="332" class="lbl" style="font-weight:600">P2P 직접 연결: 영상, 음성, 데이터</text>
  <text x="1304" y="356" class="t-s">서버를 거치지 않는다</text>

  <!-- 외부 서비스 -->
  <path d="M1236 484 V634" class="ln-stun" marker-end="url(#a-stun)"/>
  <path d="M1268 484 V600 H1486 V638" class="ln-turn"/>
  <text x="1304" y="548" class="t-s">브라우저가 직접 쓰고</text>
  <text x="1304" y="570" class="t-s">서버는 관여하지 않음</text>

  <rect x="1212" y="638" width="196" height="96" rx="2" class="equip"/>
  <text x="1230" y="664" class="name">Google STUN</text>
  <text x="1230" y="690" class="t-code" style="font-size:14px">stun.l.google.com</text>
  <text x="1230" y="714" class="t-s">포트 19302, UDP</text>

  <rect x="1424" y="638" width="136" height="96" rx="2" class="equip-opt"/>
  <text x="1442" y="664" class="name">TURN 호스팅</text>
  <text x="1442" y="690" class="t-s">선택, #38</text>
  <text x="1442" y="714" class="t-s">P2P 실패 시 중계</text>

  <!-- ===== 범례 ===== -->
  <line x1="60" y1="836" x2="1540" y2="836" style="stroke:var(--rule);stroke-width:1"/>
  <g transform="translate(60,870)">
    <line x1="0" y1="-5" x2="48" y2="-5" class="ln-http"/>
    <text x="62" y="0" class="lbl">HTTP(S): 페이지와 API</text>
    <line x1="270" y1="-5" x2="318" y2="-5" class="ln-sig"/>
    <text x="332" y="0" class="lbl">WebSocket 시그널링 (WS, WSS)</text>
    <line x1="590" y1="-5" x2="638" y2="-5" class="ln-p2p"/>
    <text x="652" y="0" class="lbl">P2P 영상, 음성, 데이터</text>
    <line x1="880" y1="-5" x2="928" y2="-5" class="ln-stun"/>
    <text x="942" y="0" class="lbl">STUN 질의 (UDP)</text>
    <line x1="1130" y1="-5" x2="1178" y2="-5" class="ln-turn"/>
    <text x="1192" y="0" class="lbl">TURN 중계 (선택)</text>
  </g>
</svg>
</div>
<script src="icons.js"></script>
</body>
</html>
