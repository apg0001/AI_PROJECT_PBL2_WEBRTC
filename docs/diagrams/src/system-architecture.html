<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시스템 아키텍처</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 계통도 선 (DESIGN.md §6) */
  .ln-sig  { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 10 6; }
  .ln-p2p  { fill: none; stroke: var(--ok); stroke-width: 8; }
  .ln-stun { fill: none; stroke: var(--steel); stroke-width: 2.5; stroke-dasharray: 0.1 7; stroke-linecap: round; }
  .ln-turn { fill: none; stroke: var(--caution); stroke-width: 3; stroke-dasharray: 18 8; }
  .zone    { fill: none; stroke: var(--rule); stroke-width: 1.5; }
  .equip   { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  .equip-opt { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .zone-name { font-size: 15px; font-weight: 600; fill: var(--steel); }
  .name { font-size: 17px; font-weight: 600; }
  .item { font-size: 15px; }
  .lbl  { font-size: 15px; fill: var(--ink); }
  .t-code.s { fill: var(--steel); }
</style>
</head>
<body>
<div id="diagram">
<svg width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="a-stun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--steel)"/></marker>
  </defs>

  <!-- 제목 -->
  <text x="60" y="66" class="t-title">WebRTC 원격 현장지원 시스템 아키텍처</text>
  <text x="60" y="100" class="t-sub">연결 정보는 시그널링 서버를 거치고, 영상과 음성과 데이터는 두 브라우저 사이를 P2P로 직접 흐른다.</text>

  <!-- 영역 경계: NAT 구간은 아래 NAT 기호가 경계를 대신한다 -->
  <line x1="440" y1="140" x2="440" y2="352" class="zone"/>
  <line x1="440" y1="738" x2="440" y2="790" class="zone"/>
  <line x1="1160" y1="140" x2="1160" y2="352" class="zone"/>
  <line x1="1160" y1="738" x2="1160" y2="790" class="zone"/>

  <text x="60" y="160" class="zone-name">현장 네트워크</text>
  <text x="60" y="186" class="t-s">Wi-Fi, LTE, 5G</text>
  <text x="60" y="208" class="t-s">사설 IP 192.168.x.x 또는 통신사 CGNAT</text>

  <text x="464" y="160" class="zone-name">인터넷</text>

  <text x="1184" y="160" class="zone-name">전문가 네트워크</text>
  <text x="1184" y="186" class="t-s">회사 또는 가정 망</text>
  <text x="1184" y="208" class="t-s">사설 IP, 공유기 NAT</text>

  <!-- ===== 선 (기기 아래에 깔린다) ===== -->
  <!-- 시그널링: 현장 → ngrok, ngrok → 서버, ngrok → 전문가 -->
  <path d="M332 543 V365 H640" class="ln-sig"/>
  <path d="M960 365 H1248 V559" class="ln-sig"/>
  <line x1="800" y1="284" x2="800" y2="335" class="ln-sig"/>
  <!-- STUN 질의 -->
  <path d="M348 543 V470 H676" class="ln-stun" marker-end="url(#a-stun)"/>
  <path d="M1232 559 V470 H924" class="ln-stun" marker-end="url(#a-stun)"/>
  <!-- TURN 중계 (선택) -->
  <path d="M340 610 V680 H680" class="ln-turn"/>
  <path d="M1240 611 V680 H920" class="ln-turn"/>
  <!-- P2P 영상·데이터 -->
  <line x1="358" y1="576" x2="1215" y2="576" class="ln-p2p"/>

  <!-- ===== NAT: 사설망과 인터넷의 경계 ===== -->
  <text x="430" y="726" class="name">NAT</text>
  <rect x="432" y="352" width="16" height="350" rx="1" class="equip"/>
  <text x="1150" y="726" class="name">NAT</text>
  <rect x="1152" y="352" width="16" height="350" rx="1" class="equip"/>

  <!-- ===== 현장 작업자 ===== -->
  <use href="#i-phone" x="300" y="536" width="80" height="80" style="color:var(--ink)"/>
  <text x="60" y="566" class="t-h">현장 작업자</text>
  <text x="60" y="592" class="t-s">스마트폰 브라우저, 설치 없음</text>
  <text x="60" y="636" class="item">후면 카메라 영상 보내기</text>
  <text x="60" y="662" class="item">음성 대화</text>
  <text x="60" y="688" class="item">포인터와 작업 지시 받기</text>

  <!-- ===== 원격 전문가 ===== -->
  <use href="#i-laptop" x="1200" y="544" width="80" height="80" style="color:var(--ink)"/>
  <text x="1300" y="566" class="t-h">원격 전문가</text>
  <text x="1300" y="592" class="t-s">PC 또는 태블릿 브라우저</text>
  <text x="1300" y="636" class="item">현장 영상 보기</text>
  <text x="1300" y="662" class="item">음성과 텍스트로 지시</text>
  <text x="1300" y="688" class="item">품질 지표 수집</text>

  <!-- ===== 시그널링 서버 (개발자 PC) ===== -->
  <rect x="600" y="166" width="400" height="118" rx="2" class="equip"/>
  <text x="624" y="196" class="name">시그널링 서버</text>
  <text x="624" y="222" class="item">Python aiohttp WebSocket <tspan class="t-code">/ws</tspan>, Room 관리</text>
  <text x="624" y="246" class="item">SDP와 ICE 후보를 상대에게 전달</text>
  <text x="624" y="272" class="t-s">개발자 PC에서 <tspan class="t-code s">python3 server/app.py</tspan>로 실행</text>

  <!-- ngrok 터널 -->
  <rect x="640" y="335" width="320" height="60" rx="2" class="equip"/>
  <text x="664" y="361" class="name">ngrok 터널</text>
  <text x="664" y="384" class="t-s">공개 HTTPS, WSS 주소</text>

  <!-- STUN -->
  <rect x="680" y="428" width="240" height="96" rx="2" class="equip"/>
  <text x="700" y="456" class="name">STUN 서버</text>
  <text x="700" y="480" class="t-code" style="font-size:14px">stun.l.google.com:19302</text>
  <text x="700" y="508" class="t-s">Google 공용 서버</text>

  <!-- TURN (선택) -->
  <rect x="680" y="636" width="240" height="88" rx="2" class="equip-opt"/>
  <text x="700" y="664" class="name">TURN 서버 <tspan class="t-s" style="font-weight:400">(선택, #38)</tspan></text>
  <text x="700" y="688" class="t-s">P2P가 안 될 때 대신 전달</text>
  <text x="700" y="710" class="t-s">Symmetric NAT, UDP 차단 시</text>

  <!-- ===== 선 이름표 ===== -->
  <text x="464" y="355" class="lbl">시그널링 (WSS)</text>
  <text x="464" y="460" class="lbl">공인 주소(srflx) 조회</text>
  <text x="464" y="562" class="lbl" style="font-weight:600">P2P 직접 연결, DTLS 암호화</text>
  <text x="464" y="602" class="t-s">영상과 음성은 SRTP, 포인터와 제어 메시지는 DataChannel(SCTP)</text>
  <text x="464" y="670" class="lbl">P2P 실패 시 중계</text>

  <!-- ===== 범례 ===== -->
  <line x1="60" y1="812" x2="1540" y2="812" style="stroke:var(--rule);stroke-width:1"/>
  <g transform="translate(60,852)">
    <line x1="0" y1="-5" x2="48" y2="-5" class="ln-sig"/>
    <text x="62" y="0" class="lbl">시그널링: 연결 정보(SDP, ICE)만 전달</text>
    <line x1="350" y1="-5" x2="398" y2="-5" class="ln-p2p"/>
    <text x="412" y="0" class="lbl">영상, 음성, 데이터: 서버를 거치지 않는 P2P</text>
    <line x1="760" y1="-5" x2="808" y2="-5" class="ln-stun"/>
    <text x="822" y="0" class="lbl">STUN 질의: NAT 바깥 주소 확인</text>
    <line x1="1110" y1="-5" x2="1158" y2="-5" class="ln-turn"/>
    <text x="1172" y="0" class="lbl">TURN 중계: P2P 실패 시 (선택)</text>
  </g>
</svg>
</div>
<script src="icons.js"></script>
</body>
</html>
