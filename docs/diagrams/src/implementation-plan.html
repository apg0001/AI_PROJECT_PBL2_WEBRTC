<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>구현 계획</title>
<link rel="stylesheet" href="base.css">
<script>
/* ===================================================================
   데이터: 매주 이 부분만 고치고 `npm run diagrams implementation-plan`
   status: done | doing | todo
   kind:   design | feat | test | docs | slides | optional
           (optional만 '선택(가산점)' 묶음으로 따로 그린다)
   =================================================================== */
const TODAY = { week: 1, date: '11/09' };

const STORY = [
  { label: '요구사항', week: 1 },
  { label: '기술선택', week: 1 },
  { label: '기능검증', week: 2 },
  { label: '품질평가', week: 3 },
  { label: '실패분석', week: 3 },
  { label: '서비스 확장 정리', week: 4 },
];

const WEEKS = [
  {
    week: 1, dates: '11/09-11/15', theme: '설계 및 연결',
    items: [
      { no: 3, title: 'Requirement', kind: 'design', status: 'done' },
      { no: 4, title: 'Architecture', kind: 'design', status: 'done' },
      { no: 5, title: 'Connection Sequence', kind: 'design', status: 'done' },
      { no: 6, title: '기술 결정', kind: 'design', status: 'done' },
      { no: 7, title: '시험계획', kind: 'test', status: 'done' },
      { no: 9, title: 'Signaling Server', kind: 'feat', status: 'done' },
      { no: 10, title: '1:1 연결', kind: 'feat', status: 'done' },
      { no: 11, title: '연결 과정 가시화', kind: 'feat', status: 'done' },
      { no: 53, title: '보고서용 그림', kind: 'docs', status: 'done' },
      { no: 12, title: '발표자료 (5장)', kind: 'slides', status: 'done' },
      { no: 58, title: '디자인 정리 (웹, 그림, 발표)', kind: 'docs', status: 'done' },
    ],
    badge: { text: 'E2E 13/13 통과, Connection 139 ms', tone: 'result' },
    deliverable: ['System Design v1.0', '같은 LAN 연결'],
  },
  {
    week: 2, dates: '11/16-11/22', theme: 'Media/Data와 측정 도구',
    items: [
      { no: 13, title: '폰↔PC 같은 LAN 검증', kind: 'test', status: 'done' },
      { no: 37, title: '다른 네트워크 연결 (LTE↔Wi-Fi)', kind: 'test', status: 'todo' },
      { no: 14, title: 'NAT / STUN / TURN 분석', kind: 'docs', status: 'todo' },
      { no: 15, title: 'Video, Audio', kind: 'feat', status: 'todo' },
      { no: 16, title: 'DataChannel 프로토콜', kind: 'feat', status: 'todo' },
      { no: 17, title: '채팅, 포인터', kind: 'feat', status: 'todo' },
      { no: 18, title: 'getStats 수집', kind: 'feat', status: 'todo' },
      { no: 19, title: 'Glass-to-Glass 측정 도구', kind: 'feat', status: 'todo' },
      { no: 20, title: '발표자료', kind: 'slides', status: 'todo' },
    ],
    deliverable: ['LMS 제출', 'Sequence, Screenshot, 성공/실패 지점'],
  },
  {
    week: 3, dates: '11/23-11/29', theme: '품질 실험과 분석',
    items: [
      { no: 21, title: '네트워크 조건별 품질 실험', kind: 'test', status: 'todo' },
      { no: 22, title: 'G2G 지연 실험', kind: 'test', status: 'todo' },
      { no: 23, title: 'KPI 선정', kind: 'docs', status: 'todo' },
      { no: 24, title: 'Reliability', kind: 'docs', status: 'todo' },
      { no: 25, title: '실패 사례', kind: 'docs', status: 'todo' },
      { no: 26, title: 'Think ≥ 3', kind: 'docs', status: 'todo' },
      { no: 27, title: 'Scalability', kind: 'docs', status: 'todo' },
      { no: 28, title: '발표자료', kind: 'slides', status: 'todo' },
      { no: 38, title: 'TURN 비교', kind: 'optional', status: 'todo' },
      { no: 32, title: 'Stats 대시보드', kind: 'optional', status: 'todo' },
    ],
    deliverable: ['중간 점검 (5분)', 'Integration Report'],
  },
  {
    week: 4, dates: '11/30-12/06', theme: '최종 정리 (버퍼)',
    items: [
      { no: 29, title: '최종 제출물 8종', kind: 'docs', status: 'todo' },
      { no: 30, title: '최종 발표 (12분)', kind: 'slides', status: 'todo' },
      { no: 31, title: 'Contribution Summary', kind: 'docs', status: 'todo' },
      { no: 33, title: 'Adaptive Control', kind: 'optional', status: 'todo' },
      { no: 34, title: 'Reconnection', kind: 'optional', status: 'todo' },
    ],
    badge: { text: '요구사항 변동에 대비한 버퍼', tone: 'note' },
    deliverable: ['Final Presentation'],
  },
];
</script>
</head>
<body>
<div id="diagram">
<svg id="plan" width="1600" height="900" viewBox="0 0 1600 900">
  <text x="60" y="66" class="t-title">4주 구현 계획</text>
  <text x="60" y="100" class="t-sub">1~3주차에 구현, 실험, 분석을 끝내고 4주차는 최종 정리와 버퍼로 둔다.</text>
  <g id="sheet"></g>
</svg>
</div>
<script>
/* ===================== 렌더러 (데이터만 바꾸면 됨) =====================
   기준: docs/DESIGN.md. 칸 선으로 나눈 점검표 양식.
   색은 뜻으로만: 초록 = 완료, 노랑 = 진행 중과 이번 주, 나머지는 먹과 강철. */
const NS = 'http://www.w3.org/2000/svg';
const L = {
  x0: 60, x1: 1540,
  story: 150,        // 흐름 글줄
  top: 176,          // 표 윗선
  headRule: 256,     // 머리칸 아래 선
  itemTop: 266, row: 31,
  badgeY: 690,       // 결과·메모 한 줄
  delivRule: 708,    // 산출물 위 선
  bottom: 806,       // 표 아랫선
  legend: 852,
};
const COLW = (L.x1 - L.x0) / 4;
const colX = (w) => L.x0 + (w - 1) * COLW;
const PAD = 20;

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}
// 폭을 넘으면 15px까지 줄이고, 그래도 넘치면 경고
function fit(t, maxW, min = 15) {
  let fs = parseFloat(getComputedStyle(t).fontSize);
  while (t.getComputedTextLength() > maxW && fs > min) { fs -= 0.5; t.style.fontSize = fs + 'px'; }
  if (t.getComputedTextLength() > maxW) console.warn('overflow:', t.textContent);
}

// 상태 표시: 완료 = 초록 원과 체크, 진행 중 = 반만 칠한 노랑 원, 예정 = 빈 원
function mark(status, cx, cy, g) {
  if (status === 'done') {
    el('circle', { cx, cy, r: 8.5, fill: 'var(--ok)' }, g);
    el('path', { d: `M${cx - 4.2} ${cy + 0.2} l3 3 l5.6 -6`, fill: 'none', stroke: 'var(--paper)', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  } else if (status === 'doing') {
    el('path', { d: `M${cx} ${cy - 8} A8 8 0 0 0 ${cx} ${cy + 8} Z`, fill: 'var(--caution)' }, g);
    el('circle', { cx, cy, r: 8, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.5 }, g);
  } else {
    el('circle', { cx, cy, r: 8, fill: 'none', stroke: 'var(--steel)', 'stroke-width': 1.5 }, g);
  }
}

function render() {
  const g = document.getElementById('sheet');
  g.replaceChildren();

  /* 흐름: 각 주차 칸 위에 글자로만 */
  for (let w = 1; w <= 4; w++) {
    const stages = STORY.filter((s) => s.week === w);
    stages.forEach((s, i) => {
      el('text', { x: colX(w) + PAD + i * (COLW / 2), y: L.story, class: 't-b' }, g, s.label);
    });
  }

  /* 표 틀 */
  el('line', { x1: L.x0, x2: L.x1, y1: L.top, y2: L.top, stroke: 'var(--ink)', 'stroke-width': 1.5 }, g);
  el('line', { x1: L.x0, x2: L.x1, y1: L.headRule, y2: L.headRule, stroke: 'var(--rule)' }, g);
  el('line', { x1: L.x0, x2: L.x1, y1: L.delivRule, y2: L.delivRule, stroke: 'var(--rule)' }, g);
  el('line', { x1: L.x0, x2: L.x1, y1: L.bottom, y2: L.bottom, stroke: 'var(--ink)', 'stroke-width': 1.5 }, g);
  for (let w = 2; w <= 4; w++) el('line', { x1: colX(w), x2: colX(w), y1: L.top, y2: L.bottom, stroke: 'var(--rule)' }, g);

  for (const W of WEEKS) {
    const x = colX(W.week), tx = x + PAD, now = W.week === TODAY.week;

    // 머리칸
    if (now) {
      el('rect', { x, y: L.top - 3, width: COLW, height: 6, fill: 'var(--caution)' }, g);
      el('text', { x: x + COLW - PAD, y: 210, 'text-anchor': 'end', class: 't-s', style: 'fill:var(--ink);font-weight:600' }, g, `이번 주, 오늘 ${TODAY.date}`);
    }
    const h = el('text', { x: tx, y: 210, class: 't-h' }, g, `${W.week}주차`);
    el('text', { x: tx + h.getComputedTextLength() + 12, y: 210, class: 't-s' }, g, W.dates);
    fit(el('text', { x: tx, y: 240, class: 't-b' }, g, W.theme), COLW - PAD * 2);

    // 항목
    let y = L.itemTop;
    const row = (it) => {
      const cy = y + L.row / 2;
      mark(it.status, tx + 8, cy, g);
      el('text', { x: tx + 64, y: cy + 5, 'text-anchor': 'end', class: 't-s' }, g, `#${it.no}`);
      const t = el('text', { x: tx + 74, y: cy + 6, class: 't-b', style: it.status === 'doing' ? 'font-weight:600' : '' }, g, it.title);
      fit(t, COLW - PAD - 74 - PAD);
      y += L.row;
    };
    W.items.filter((i) => i.kind !== 'optional').forEach(row);
    const opts = W.items.filter((i) => i.kind === 'optional');
    if (opts.length) {
      y += 14;
      el('line', { x1: tx, x2: x + COLW - PAD, y1: y, y2: y, stroke: 'var(--rule)' }, g);
      el('text', { x: tx, y: y + 24, class: 't-s' }, g, '선택(가산점)');
      y += 32;
      opts.forEach(row);
    }
    if (y > L.badgeY - 22) console.warn('items overflow week', W.week);

    // 결과·메모 한 줄
    if (W.badge) {
      const ok = W.badge.tone === 'result';
      const b = el('text', { x: tx, y: L.badgeY, class: 't-s', style: ok ? 'fill:var(--ok);font-weight:600' : '' }, g, W.badge.text);
      fit(b, COLW - PAD * 2, 13);
    }

    // 산출물
    el('text', { x: tx, y: L.delivRule + 26, class: 't-xs' }, g, '산출물');
    W.deliverable.forEach((line, i) => {
      const t = el('text', { x: tx, y: L.delivRule + 52 + i * 24, class: i === 0 ? 't-b' : 't-s', style: i === 0 ? 'font-weight:600' : 'fill:var(--ink)' }, g, line);
      fit(t, COLW - PAD * 2, 13);
    });
  }

  /* 범례: 한 줄 */
  const lg = el('g', { transform: `translate(${L.x0},${L.legend})` }, g);
  let lx = 0;
  const lab = (s) => { const t = el('text', { x: lx, y: 5, class: 't-s', style: 'fill:var(--ink)' }, lg, s); lx += t.getComputedTextLength() + 32; };
  mark('done', lx + 8, 0, lg); lx += 24; lab('완료');
  mark('doing', lx + 8, 0, lg); lx += 24; lab('진행 중');
  mark('todo', lx + 8, 0, lg); lx += 24; lab('예정');
}

render();
// 웹 글꼴이 늦게 오면 글자 폭을 다시 재서 그린다
document.fonts.ready.then(render);
</script>
</body>
</html>
