<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원격 현장지원</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
  <main class="start">
    <h1>원격 현장지원</h1>
    <p class="muted">현장 작업자의 폰과 원격 전문가의 PC를 같은 Room으로 연결합니다.</p>

    <ol class="steps">
      <li>
        <h2>Room 정하기</h2>
        <p class="muted">두 사람이 같은 번호로 들어오면 연결됩니다.</p>
        <p class="room-code" id="room"></p>
        <button id="newRoom">새 번호 만들기</button>
      </li>
      <li>
        <h2>현장 작업자: 폰으로 열기</h2>
        <p class="muted">폰 카메라로 QR을 찍거나 주소를 입력합니다.</p>
        <div class="qr" id="qr"></div>
        <a class="link" id="fieldLink" target="_blank"></a>
      </li>
      <li>
        <h2>원격 전문가: PC로 열기</h2>
        <p class="muted">이 PC에서 엽니다.</p>
        <a class="link" id="expertLink" target="_blank"></a>
      </li>
    </ol>

    <p class="note" id="note"></p>
    <p class="note"><a href="check.html">이 기기에서 카메라를 쓸 수 있는지 확인하기</a></p>
  </main>
  <script type="module">
    const $ = (id) => document.getElementById(id);

    function randomRoom() {
      const b = crypto.getRandomValues(new Uint8Array(8));
      return [...b].map((x) => x.toString(36).padStart(2, '0')).join('').slice(0, 12);
    }

    // PC에서 localhost로 열었으면 폰이 접속할 수 있도록 LAN 주소로 바꾼다
    async function phoneOrigin() {
      if (!['localhost', '127.0.0.1'].includes(location.hostname)) return location.origin;
      try {
        const { lan, port } = await (await fetch('/api/info')).json();
        const ip = lan.find((a) => /^(192\.168|10\.|172\.(1[6-9]|2\d|3[01]))/.test(a)) ?? lan[0];
        if (ip) return `${location.protocol}//${ip}:${port}`;
      } catch {}
      return location.origin;
    }

    async function render(room) {
      history.replaceState(null, '', `?room=${room}`);
      $('room').textContent = room;
      const origin = await phoneOrigin();
      const field = `${origin}/field.html?room=${room}`;
      const expert = `${location.origin}/expert.html?room=${room}`;
      $('fieldLink').href = $('fieldLink').textContent = field;
      $('expertLink').href = $('expertLink').textContent = expert;
      if (window.qrcode) {
        const qr = qrcode(0, 'M');
        qr.addData(field);
        qr.make();
        $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0 });
      }
      $('note').textContent = location.protocol === 'http:'
        ? '지금은 http 주소라서 폰 카메라를 쓸 수 없습니다. 연결 시험은 그대로 되고, 카메라를 쓰려면 ngrok의 https 주소로 여세요.'
        : '';
    }

    $('newRoom').onclick = () => render(randomRoom());
    render(new URLSearchParams(location.search).get('room') ?? randomRoom());
  </script>
</body>
</html>
